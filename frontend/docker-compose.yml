version: '3.8'

services:
  echoflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoflow-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uploads_data:
    driver: local
