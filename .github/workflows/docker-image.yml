name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Docker build target (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - api
          - media

permissions:
  contents: read
  packages: write

env:
  DOCKER_HUB_REPO: devansh10gaur/echoflow
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FIX 1: Robust matrix fallback. If no input or 'all', build both. Otherwise, build the specific target.
        target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'all' && github.event.inputs.target != '' && fromJSON(format('["{0}"]', github.event.inputs.target)) || fromJSON('["api", "media"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The wheelhouse can't live in git (torch-2.8.0+cpu is 176MB, exceeds
      # GitHub's 100MB per-file limit). Generate it fresh in CI so the
      # Dockerfile COPY wheelhouse/ always has content. Python 3.11 matches
      # the Dockerfile's python:3.11-slim-bookworm base image.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate wheelhouse
        run: |
          # dj-rest-auth is sdist-only on PyPI — must be built into a wheel.
          pip wheel --no-deps -w wheelhouse 'dj-rest-auth==7.2.0'
          # Everything else: download pre-built cp311 wheels (transitive deps
          # resolved automatically). --prefer-binary avoids sdist fallback.
          pip download --prefer-binary --retries 10 --timeout 120 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt -r requirements-base.txt -d wheelhouse
          pip download --prefer-binary --retries 10 --timeout 120 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt -r requirements-media.txt -d wheelhouse

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: devansh10gaur
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_HUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Layer cache (type=gha) is scoped per matrix target so the api and
      # media caches don't collide. Target-specific scope means a
      # source-only change in backend/ doesn't bust the heavy media layer
      # cache and vice-versa — each target only re-pushes its own delta.
      #
      # NOTE on the BuildKit NAMED cache mounts (echoflow-apt / echoflow-pip
      # / echoflow-hf declared in the Dockerfile with --mount=type=cache):
      # these are independent of the layer cache above. They DO NOT persist
      # across CI runs — GitHub Actions runners start with empty BuildKit
      # cache mounts and there is no built-in `cache-from`/`cache-to`
      # support for named mount caches in docker/build-push-action@v5. They
      # only speed up repeated local builds on the same machine. The
      # `echoflow-hf` mount in particular means every CI run re-downloads
      # the ~250 MB of HuggingFace model artifacts. If slow network
      # becomes a CI cost issue, see docs/EXPLAIN/docker/01-multi-stage-
      # dockerfile.md §"BuildKit cache" for the registry-backed upgrade.
      #
      # load: PRs don't push to a registry, so `load: true` makes the
      # freshly-built image available to the next step's smoke test
      # without requiring docker pull. On push runs, `load: false` is the
      # default — the image is pushed to the registry directly.
      - name: Build and push ${{ matrix.target }} image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # HF_TOKEN reaches the Dockerfile ONLY as a BuildKit secret consumed
          # by --mount=type=secret,id=hf_token (never ARG/ENV), so it cannot
          # leak into image layers, history, or logs. Unquoted: the action
          # parses key=value verbatim, quotes would corrupt the token.
          # Empty string is intentional for the api target — the api image
          # does not call --mount=type=secret,id=hf_token so the empty value
          # is never read.
          secrets: |
            hf_token=${{ matrix.target == 'media' && secrets.HF_TOKEN || '' }}

      # Smoke-test the freshly-built image. This step guards against
      # regression of the 2026-09-07 build bug where the Dockerfile's
      # BuildKit cache mount for HuggingFace models made them invisible
      # to a subsequent `COPY --from=py-deps-media` — the layer had no
      # models even though the build "succeeded". The check asserts the
      # baked models are actually present and loadable in the exact
      # offline mode the celery_media container runs in.
      #
      # On PRs we test the locally-loaded image (load: true above). On
      # push runs the image is pushed (not loaded), so we skip the smoke
      # test here — the smoke test is the point of the pull_request
      # branch in the first place, and re-pulling a 4.6 GB image for
      # a second verification would just be a slower, equivalent check.
      - name: Smoke-test media image HF bake (PR only, media only)
        if: matrix.target == 'media' && github.event_name == 'pull_request'
        run: |
          set -eu
          # build-push-action with load:true makes the image available
          # locally under every tag in `steps.meta.outputs.tags`. Pick
          # the first one for the smoke test.
          SOURCE_TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          test -n "$SOURCE_TAG" || { echo "no image tag from build step"; exit 1; }
          docker run --rm --user root "$SOURCE_TAG" \
            sh -c '
              set -eu
              test -d /home/appuser/.cache/huggingface/hub            || { echo "HF bake missing: hub/ directory";     exit 1; }
              test -d /home/appuser/.cache/huggingface/xet            || { echo "HF bake missing: xet/ directory";     exit 1; }
              find /home/appuser/.cache/huggingface -name "*.bin" -o -name "*.safetensors" 2>/dev/null | grep -q . \
                || { echo "HF bake missing: no model weights found"; exit 1; }
              HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
                python -c "from faster_whisper import WhisperModel; WhisperModel(\"base\", device=\"cpu\", compute_type=\"int8\")" 2>&1 | tail -1
              HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
                python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer(\"all-MiniLM-L6-v2\")" 2>&1 | tail -1
              echo "media image HF bake OK"
            '
