name: Django CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # DECISION: env hoisted to job level — per-step env blocks had drifted (the
    # collectstatic step omitted FIELD_ENCRYPTION_KEY, which models.py requires at
    # import time) and would drift again. Every step now inherits the same config.
    env:
      DATABASE_URL: postgresql://echoflow:testpassword@localhost:5432/echoflow_test
      REDIS_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: echoflow_test
          POSTGRES_USER: echoflow
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            ffmpeg \
            libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DECISION: `migrate --check` exits 1 whenever ANY migration is unapplied and never
      # applies them — on a fresh CI database that is always true, so it could never pass.
      # We apply migrations instead, then use `makemigrations --check --dry-run` to catch
      # model changes that are missing migration files.
      - name: Run migrations
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: |
          python manage.py check --fail-level WARNING

      - name: Run tests
        run: |
          python manage.py test backend.app --verbosity 2

      # DECISION: collectstatic has no --check flag (that's migrate). --dry-run alone
      # exercises finders + WhiteNoise storage config without writing files.
      - name: Check static files
        run: |
          python manage.py collectstatic --noinput --dry-run
