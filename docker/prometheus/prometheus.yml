global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "echoflow-dev"

scrape_configs:
  - job_name: "echoflow-web"
    metrics_path: "/metrics/"
    static_configs:
      - targets: ["web:8005"]
        labels:
          service: "web"
          tier: "echoflow"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
