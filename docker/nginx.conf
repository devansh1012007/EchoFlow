# EchoFlow — nginx TLS terminator + reverse proxy
#
# DESIGN:
#   - Listens on :80 (HTTP) and :443 (HTTPS) for the Django API.
#   - Listens on :9443 (HTTPS) for MinIO/S3-compatible object storage so
#     browsers can fetch HLS segments over HTTPS (mixed-content-safe).
#   - HTTP traffic is permanently redirected to HTTPS — there is NO
#     fall-through to the backend over plain HTTP.
#   - WebSocket upgrade headers are NOT needed (Django + DRF are HTTP/1.1
#     and HTTP/2 only here).
#   - X-Forwarded-Proto https is set on every upstream request so Django's
#     SECURE_PROXY_SSL_HEADER ('HTTP_X_FORWARDED_PROTO', 'https') sees
#     request.is_secure() == True — required for SECURE_SSL_REDIRECT to
#     stop looping and for secure cookies to be issued.
#
# DECISION: TLS terminated at nginx, not gunicorn. Reasoning:
#   - Certificate management (renewal, rotation, OCSP) belongs at the edge,
#     not inside the application container. Renewing a cert should not
#     require a web-container restart.
#   - One TLS terminator fronts every backend service uniformly. The same
#     certificate can later cover MinIO, a static-asset bucket, or a future
#     microservice without touching application code.
#   - gunicorn speaks plain HTTP to nginx over the docker-internal network.
#     No TLS overhead on the inner hop. Cert/key never enter the app image.
#
# CERT PATHS:
#   /etc/nginx/certs/localhost.crt + .key are bind-mounted from
#   ./docker/certs/ on the host (see docker-compose.yml). For dev these
#   are the self-signed cert generated by AGENTS.md's openssl one-liner.
#   For production, replace them with a Let's Encrypt fullchain + privkey
#   and reload nginx (no app-side change required).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Basic hardening ---------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;            # do not advertise nginx version in errors
    client_max_body_size 100m;    # match Django DATA_UPLOAD_MAX_MEMORY_SIZE for clip uploads

    # --- Logging -----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Upstreams ---------------------------------------------------------
    upstream django_backend {
        server web:8000;
        keepalive 32;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 32;
    }

    # --- HTTP :80  →  HTTPS :443 redirect ----------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # /health/ and /ready/ are liveness/readiness probes; even those
        # must travel over HTTPS once SECURE_SSL_REDIRECT is on. The
        # docker-compose healthcheck for `web` already calls the upstream
        # directly (in-network), so this 301 only affects external clients.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443  →  Django ---------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Modern TLS profile — TLS 1.2 minimum, modern ciphers only.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # SECURITY: HSTS (1 year, subdomains, preload-eligible). The browser
        # then refuses to speak HTTP to this host for the next 31536000 s.
        # Mirrors Django's SECURE_HSTS_* settings so even a request that
        # never reaches Django (cached redirect, dropped connection) carries
        # the instruction. HSTS is only honored by browsers on the SECOND
        # visit, so this doesn't break the first load.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://django_backend;

            # Pass the real client identity and the ORIGINAL protocol up
            # to Django. Without X-Forwarded-Proto https, Django's
            # SecurityMiddleware cannot detect TLS and SECURE_SSL_REDIRECT
            # creates a redirect loop (it sees request.is_secure()==False
            # even though the wire was HTTPS).
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            # Long-lived feed poll: gunicorn timeout is 120s, give nginx
            # the same ceiling plus a small buffer.
            proxy_connect_timeout 5s;
            proxy_send_timeout    130s;
            proxy_read_timeout    130s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # --- HTTPS :9443  →  MinIO (browser HLS playback) ----------------------
    #
    # Browsers refuse to load HTTP sub-resources from an HTTPS page
    # (mixed-content block). The hls/ bucket prefix is public-read per
    # docker-compose.yml's `mc anonymous set download .../hls` step, so
    # we just need a stable HTTPS origin for <video>/hls.js to hit.
    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Larger buffers for HLS segments (often >1 MB).
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
